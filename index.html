    <title>El Paso Mexican Restaurant</title>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {

                extend: {
                    fontFamily: {

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->

        /* Hide scrollbar for cleaner look in some components */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { background-color: #FDFBF7; }
    </style>
</head>

        const MENU_CATEGORIES = [
            {

                items: [
                    { id: 1, name: "Birria Burrito", desc: "Filled with rice, beans, birria meat, onion, cilantro, and mozzarella cheese." },

            const variants = {
                primary: "bg-brand-red text-white hover:bg-brand-darkRed shadow-md hover:shadow-lg",
                secondary: "bg-brand-slate text-white hover:bg-[#0F172A] shadow-md hover:shadow-lg",
                outline: "border-2 border-brand-red text-brand-red hover:bg-brand-red hover:text-white",
                heroOutline: "border-2 border-white bg-black/40 text-white hover:bg-white hover:text-gray-900 shadow-md hover:shadow-lg",
                whiteSolid: "bg-white text-brand-red hover:bg-gray-100 shadow-md hover:shadow-lg"
            };
            
            if (href) {
                return (
                    <a href={href} className={`${baseStyle} ${variants[variant]} ${className}`}>
                        {children}
                    </a>
                );
            }

            return (
                <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

                                    {product.isGiftCard ? (

                            <div className="hidden xl:block flex-shrink-0">
                                <Button href={BIZ_INFO.phoneLink} variant="whiteSolid" className="py-2 px-5 text-sm shadow-lg">CALL TO ORDER</Button>
                            </div>

                                    <li><button onClick={() => handleNavClick('home')} className="hover:text-white hover:translate-x-1 transition-transform inline-block">Home</button></li>

                                    <a href="https://www.instagram.com/elpasoplainvillect/?hl=en" target="_blank" rel="noreferrer" className="bg-white/10 p-2 rounded-full hover:bg-[#E4405F] transition-colors"><Instagram size={20} /></a>

                                    </a>
                                    <a href="https://www.youtube.com/channel/UCSHWeNbhgBjOFe9nBOHsD-g?view_as=subscriber" target="_blank" rel="noreferrer" className="bg-white/10 p-2 rounded-full hover:bg-[#FF0000] transition-colors"><Youtube size={20} /></a>
                                </div>
                            </div>
                        </div>
                        <div className="relative z-10 text-center font-sans text-xs text-white/50 pt-8 border-t border-white/10">
                            &copy; {new Date().getFullYear()} El Paso Mexican Restaurant. All rights reserved.
                        </div>
                    </footer>

                    {/* Promotional Popup CTA */}
                    {showPopup && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-white w-full max-w-md rounded-sm shadow-2xl relative overflow-hidden animate-slideUp">
                                <button onClick={dismissPopup} className="absolute top-4 right-4 text-gray-400 hover:text-black z-10 bg-white/80 rounded-full p-1">
                                    <XIcon size={24} />
                                </button>
                                <div className="h-32 bg-cover bg-center" style={{ backgroundImage: `url(${ASSETS.food[2]})` }}></div>
                                <div className="p-8 text-center">
                                    <h3 className="font-serif text-3xl text-brand-slate mb-3">Hungry? El Paso Is Just a Click Away.</h3>
                                    <p className="font-sans text-brand-slate/70 mb-8">Explore our Mexican favorites, discover the menu and experience El Paso.</p>
                                    <div className="flex flex-col gap-3">
                                        <Button href={BIZ_INFO.phoneLink} variant="primary" className="w-full">CALL TO ORDER</Button>

                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
